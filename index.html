<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#202b1c"
    />

    <meta
      name="description"
      content="A Nokia 3310-inspired Snake II remake built with TypeScript and Canvas 2D."
    />

    <title>
      Snake II  Nokia LCD Restoration
    </title>
  </head>

  <body>
    <main class="app">

      <header class="app-heading">
        <strong>SNAKE II</strong>

        <span>
          NOKIA 3310  LCD RESTORATION
        </span>
      </header>

      <div id="lcd-stage" class="lcd-stage">
        <section
        id="lcd-viewport"
        class="lcd-viewport"
        aria-label="Retro LCD screen"
      >
        <canvas
          id="lcd"
          width="84"
          height="48"
          role="img"
          aria-label="Original Snake II title artwork on a monochrome LCD"
        ></canvas>
        </section>
      </div>

      <div class="control-strip">

        <button
          id="display-mode"
          type="button"
          aria-pressed="false"
        >
          REMASTER DISPLAY
        </button>

      </div>

      <p
        id="status"
        role="status"
        aria-live="polite"
      >
        Loading title bitmapâ€¦
      </p>
    </main>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
